ight="600">🔓 Open-Source AD</text><rect width="160" height="34" x="334" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/><text x="350" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🌐 LDAP &amp; Sovereign</text></g></g></svg>