<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Subtle Dynamic Pulse Animations (Background elements only) */
    @keyframes pulseCircle {
      0% { transform: scale(1); opacity: 0.2; }
      50% { transform: scale(1.08); opacity: 0.4; }
      100% { transform: scale(1); opacity: 0.2; }
    }
    
    @keyframes floatParticle {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0px); }
    }

    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }

    .bg-pulse1 { animation: pulseCircle 6s ease-in-out infinite; transform-origin: 1050px 80px; }
    .bg-pulse2 { animation: pulseCircle 8s ease-in-out infinite; transform-origin: 150px 240px; }
    .particle1 { animation: floatParticle 4s ease-in-out infinite; }
    .particle2 { animation: floatParticle 5s ease-in-out infinite 1s; }
    .connecting-line { stroke-dasharray: 8 6; animation: dashMove 3s linear infinite; }
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)" />
  <rect width="1196" height="316" x="2" y="2" rx="14" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />

  <!-- Background Animated Shapes (Kept strictly behind foreground text) -->
  <circle class="bg-pulse1" cx="1050" cy="80" r="140" fill="#3b82f6" opacity="0.15" />
  <circle class="bg-pulse2" cx="150" cy="240" r="180" fill="#8b5cf6" opacity="0.12" />

  <!-- Directory Tree Network Graphics (Right Side Background Decor) -->
  <g opacity="0.25">
    <line class="connecting-line" x1="850" y1="160" x2="950" y2="100" stroke="#06b6d4" stroke-width="2" />
    <line class="connecting-line" x1="850" y1="160" x2="950" y2="160" stroke="#3b82f6" stroke-width="2" />
    <line class="connecting-line" x1="850" y1="160" x2="950" y2="220" stroke="#8b5cf6" stroke-width="2" />

    <circle cx="850" cy="160" r="8" fill="#06b6d4" />
    <circle cx="950" cy="100" r="6" fill="#3b82f6" />
    <circle cx="950" cy="160" r="6" fill="#3b82f6" />
    <circle cx="950" cy="220" r="6" fill="#8b5cf6" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle class="particle1" cx="220" cy="70" r="4" fill="#38bdf8" opacity="0.6" />
  <circle class="particle2" cx="1000" cy="250" r="5" fill="#c084fc" opacity="0.5" />
  <circle class="particle1" cx="750" cy="280" r="3" fill="#818cf8" opacity="0.7" />

  <!-- FOREGROUND CONTENT (Guaranteed clear & visible above background) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 52)">
      <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
      <text x="16" y="21" class="badge-text">⚡ CURATED IAM &amp; DIRECTORY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="135" class="title" filter="url(#subtleGlow)">
      Awesome Managed Active Directory
    </text>

    <!-- Subtitle -->
    <text x="0" y="180" class="subtitle">
      Enterprise Cloud Directories, Sovereign Identity Platforms &amp; Open-Source AD Solutions
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 220)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">☁️ Managed SaaS</text>

      <!-- Tag 2 -->
      <rect x="162" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="178" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🔓 Open-Source AD</text>

      <!-- Tag 3 -->
      <rect x="334" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="350" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🌐 LDAP &amp; Sovereign</text>
    </g>
  </g>
</svg>
